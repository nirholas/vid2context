name: Feature request
description: Suggest a concrete improvement. For open-ended ideas, start in Discussions → Ideas.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to happen. Mention the surface if it matters (library, CLI, MCP server, HTTP API, web app).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
