[project]
name = "vid2context"
version = "0.1.0"
description = "Python client for the vid2context HTTP API, with LangChain and LlamaIndex loaders that turn videos into documents with timestamp metadata."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "nirholas" }]
keywords = ["video", "transcript", "youtube", "langchain", "llama-index", "rag", "document-loader"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
llama-index = ["llama-index-core>=0.12"]

[project.urls]
Homepage = "https://github.com/nirholas/vid2context"
Source = "https://github.com/nirholas/vid2context/tree/main/clients/python"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "langchain-core>=0.3", "llama-index-core>=0.12"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vid2context"]

[tool.hatch.build.targets.sdist]
include = ["src/vid2context", "tests", "scripts", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
