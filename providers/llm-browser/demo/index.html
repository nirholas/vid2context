<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vid2context: in-browser LLM demo</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; background: #000; color: #fafafa; max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
      fieldset { border: 1px solid #26262b; border-radius: 12px; padding: 1rem; display: grid; gap: 0.75rem; }
      label { display: grid; gap: 0.25rem; color: #a1a1aa; }
      input, select, textarea, button { font: inherit; background: #0b0b0d; color: #fafafa; border: 1px solid #3a3a42; border-radius: 8px; padding: 0.5rem; }
      button { background: linear-gradient(135deg, #3b82f6, #22d3ee); border: 0; cursor: pointer; }
      progress { width: 100%; }
      pre { font: 13px/1.5 ui-monospace, monospace; background: #0b0b0d; border: 1px solid #26262b; border-radius: 12px; padding: 1rem; white-space: pre-wrap; }
      #log { color: #71717a; max-height: 12rem; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>In-browser LLMs</h1>
    <p>WebLLM runs small models on WebGPU; Chrome built-in AI uses the on-device model. Prompts never leave this tab.</p>
    <pre id="support" data-state="detecting">Detecting...</pre>
    <form id="form">
      <fieldset>
        <label>Rung <select id="rung"></select></label>
        <label>WebLLM model (WEBLLM_MODEL) <input id="model" /></label>
        <label>Prompt <textarea id="prompt" rows="4">In one sentence, what did Neil Armstrong say when he stepped onto the Moon?</textarea></label>
        <button id="run" type="submit">Ask</button>
      </fieldset>
    </form>
    <p id="status" data-state="idle">Idle.</p>
    <progress id="progress" max="1" value="0"></progress>
    <pre id="answer"></pre>
    <pre id="log"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
