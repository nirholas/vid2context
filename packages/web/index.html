<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Paste a video link or drop a file. Get the transcript, chapters, metadata and every format as files, a .zip and text ready for AI agents." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/app/favicon.svg" type="image/svg+xml" />
    <title>vid2context: any video as context for AI agents</title>
    <script>
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem('v2c.theme');
        } catch {}
        if (theme === 'light' || theme === 'dark' || theme === 'system') document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
